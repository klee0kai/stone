name: Deploy Pull Request

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  tests:
    strategy:
      matrix:
        include:
          - java_version: 17
            java_distribution: "temurin"
          - java_version: 17
            java_distribution: "oracle"
          - java_version: 17
            java_distribution: "corretto"
    runs-on: ubuntu-latest
    name: Run Unit Tests on Java ${{ matrix.java_distribution }} ${{ matrix.java_version }}
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java_version }}
          distribution: ${{ matrix.java_distribution }}
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Test with Gradle
        run: ./gradlew test
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.java_distribution }}-${{ matrix.java_version }}
          path: |
            ./**/build/reports
            ./**/build/test-results

  mikepenz_report:
    name: Prepare Mikepenz Test Report
    needs: tests
    runs-on: ubuntu-latest
    if: ${{ always() }}
    strategy:
      matrix:
        include:
          - java_version: 17
            java_distribution: "temurin"
          - java_version: 17
            java_distribution: "oracle"
          - java_version: 17
            java_distribution: "corretto"
    steps:
      - uses: actions/checkout@v3
      - name: Download Test Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-report-${{ matrix.java_distribution }}-${{ matrix.java_version }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v3
        with:
          report_paths: '**/build/test-results/**/*.xml'
          detailed_summary: true
          check_name: Mikepenz JUnit Test Report



      
